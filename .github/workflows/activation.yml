name: Request Unity License Activation

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request manual activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        uses: game-ci/unity-request-activation-file@v2
        id: getActivationFile

      - name: Upload activation file artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnityLicenseRequest-${{ steps.getActivationFile.outputs.fileName }}
          path: ${{ steps.getActivationFile.outputs.filePath }}
